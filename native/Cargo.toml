[package]
name = "wormkernel"
version = "0.1.0"
edition = "2021"
description = "Hot physics loops for py-worms-claude (C ABI, loaded via ctypes)"
publish = false

[lib]
name = "wormkernel"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
