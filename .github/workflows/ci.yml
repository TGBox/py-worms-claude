name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Dependencies
        run: uv sync --all-groups

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Build Rust physics kernel
        run: uv run build-native

      - name: Run Tests (Rust kernel)
        env:
          SDL_VIDEODRIVER: dummy
          ARCADE_HEADLESS: "True"
        run: uv run pytest

      - name: Run Tests (Python fallback)
        env:
          SDL_VIDEODRIVER: dummy
          ARCADE_HEADLESS: "True"
          PY_WORMS_NATIVE: "0"
        run: uv run pytest